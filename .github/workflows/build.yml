name: Build Plugin

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Clear broken Maven cache
        run: |
          rm -rf ~/.m2/repository/com/sk89q/worldedit
          rm -rf ~/.m2/repository/com/sk89q/worldguard

      - name: Build
        run: mvn -U clean package

      - name: Upload Jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: target/*.jar
